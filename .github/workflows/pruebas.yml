# Antes de aceptar un cambio: cada algoritmo contra sus fotos de ejemplo + flujo simulado.
name: pruebas
on:
  pull_request: {}
  push:
    paths-ignore: ["datos/**"]
jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install -r requirements.txt
      - run: python probar.py
