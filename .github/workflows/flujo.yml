# Corre el flujo cada hora y guarda los resultados en datos/ (el panel los lee de ahí).
name: flujo
on:
  schedule:
    - cron: "17 * * * *"   # minuto 17 de cada hora (UTC); GitHub puede atrasarlo unos minutos
  workflow_dispatch: {}    # botón "Run workflow" para correrlo a mano
permissions:
  contents: write
  issues: write            # avisos por mail de las alertas
concurrency: flujo         # nunca dos corridas a la vez
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python flujo.py
      - run: python avisar.py
        continue-on-error: true  # si falla el aviso, los datos se guardan igual
        env: { GH_TOKEN: "${{ github.token }}" }
      - run: bash guardar.sh "datos $(date -u +%Y-%m-%dT%H:%MZ)" rehacer
