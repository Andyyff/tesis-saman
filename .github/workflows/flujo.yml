# Corre el flujo cada hora y guarda los resultados en datos/ (el panel los lee de ahí).
name: flujo
on:
  schedule:
    - cron: "17 * * * *"   # minuto 17 de cada hora (UTC); GitHub puede atrasarlo unos minutos
  workflow_dispatch: {}    # botón "Run workflow" para correrlo a mano
permissions:
  contents: write
concurrency: flujo         # nunca dos corridas a la vez
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - run: python flujo.py
      - run: bash guardar.sh "datos $(date -u +%Y-%m-%dT%H:%MZ)" rehacer
