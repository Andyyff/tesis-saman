<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cómo miden los modelos</title>
<!-- Página interna del equipo: foto por foto, qué leyó cada modelo y por qué. Separada del panel (index.html).
     Lee datos/lecturas/<cámara>/AAAA-MM-DD.csv y datos/panel/ (lo que escribe flujo.py); las fotos vienen de Nexlab (S3). -->
<style>
:root { --bg:#f5f6f8; --card:#fff; --head:#2b2440; --txt:#1d2329; --sub:#66707a; --borde:#e3e6ea;
        --ok:#2f8a4c; --no:#b7791f; --acento:#5a4fcf; --gap:16px; --radius:8px; }
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif; background:var(--bg); color:var(--txt); line-height:1.5; }
.contenedor { max-width:1400px; margin:0 auto; padding:var(--gap); }
header { background:var(--head); color:#fff; padding:18px 24px; border-radius:var(--radius); margin-bottom:var(--gap);
         display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px; }
header h1 { font-size:20px; font-weight:600; }
header .sub { font-size:13px; color:rgba(255,255,255,.7); }
header a { color:#fff; font-size:13px; }
.controles { display:flex; gap:10px; align-items:center; flex-wrap:wrap; font-size:13px; margin-bottom:var(--gap); }
.controles button, .controles select { padding:7px 14px; border-radius:6px; border:1px solid var(--borde); background:var(--card); font-size:13px; cursor:pointer; }
.controles button.activo { background:var(--acento); color:#fff; border-color:var(--acento); }
.tarjeta { background:var(--card); border-radius:var(--radius); padding:16px 20px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:var(--gap); }
.tarjeta h3 { font-size:14px; font-weight:600; margin-bottom:10px; }
.explica { display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); font-size:14px; }
.explica ol { margin-left:20px; } .explica li { margin:3px 0; }
.explica img { max-width:100%; border-radius:6px; border:1px solid var(--borde); }
.resumen { display:flex; gap:24px; flex-wrap:wrap; font-size:14px; }
.resumen b { font-size:22px; display:block; }
.visor { display:grid; grid-template-columns:minmax(0,3fr) minmax(280px,2fr); gap:var(--gap); }
.foto { position:relative; background:#111; border-radius:6px; min-height:300px; display:flex; align-items:center; justify-content:center; }
.foto img { max-width:100%; max-height:70vh; display:block; }
.foto .nav { position:absolute; top:50%; transform:translateY(-50%); background:rgba(0,0,0,.55); color:#fff; border:0; font-size:22px; padding:10px 14px; cursor:pointer; border-radius:6px; }
.foto .nav.izq { left:8px; } .foto .nav.der { right:8px; }
.lectura h2 { font-size:16px; margin-bottom:2px; } .lectura .cuando { font-size:13px; color:var(--sub); margin-bottom:12px; }
.var { border:1px solid var(--borde); border-radius:6px; padding:10px 12px; margin-bottom:8px; }
.var .n { font-size:12px; color:var(--sub); text-transform:uppercase; letter-spacing:.4px; }
.var .v { font-size:24px; font-weight:700; }
.var .v.no { font-size:15px; font-weight:600; color:var(--no); }
.var .d { font-size:12px; color:var(--sub); margin-top:2px; word-break:break-word; }
.tira { display:flex; gap:4px; overflow-x:auto; padding:6px 0 2px; }
.tira button { flex:0 0 auto; border:1px solid var(--borde); background:var(--card); border-radius:4px; font-size:11px; padding:3px 6px; cursor:pointer; }
.tira button.no { border-color:var(--no); color:var(--no); }
.tira button.actual { background:var(--acento); color:#fff; border-color:var(--acento); }
.ayuda { font-size:12px; color:var(--sub); }
.error { background:#f8dedb; color:#c0392b; padding:12px 16px; border-radius:var(--radius); margin-bottom:var(--gap); display:none; }
@media (max-width:900px) { .explica, .visor { grid-template-columns:1fr; } }
</style>
</head>
<body>
<div class="contenedor">
  <header>
    <div><h1>Cómo miden los modelos</h1><div class="sub">Uso interno del equipo: foto por foto, qué leyó cada modelo y por qué</div></div>
    <a href="index.html">← Volver al panel</a>
  </header>
  <div class="error" id="error"></div>
  <div class="controles">
    <span>Modelo</span>
    <button data-cam="top" class="activo">Top · apertura</button>
    <button data-cam="left">Left · pesas y ángulo</button>
    <button data-cam="amp">Amp · amperaje</button>
    <span style="margin-left:12px">Día</span> <select id="dia"></select>
    <span style="margin-left:12px">Ver</span>
    <select id="filtro"><option value="todas">Todas las fotos</option><option value="no">Solo las que no pudo medir</option><option value="si">Solo las medidas</option></select>
  </div>
  <div class="tarjeta"><h3 id="titulo-explica"></h3><div class="explica" id="explica"></div></div>
  <div class="tarjeta"><h3>Resumen del día</h3><div class="resumen" id="resumen"></div></div>
  <div class="tarjeta">
    <div class="visor">
      <div class="foto"><button class="nav izq" id="ant" aria-label="Foto anterior">‹</button><img id="img" alt=""><button class="nav der" id="sig" aria-label="Foto siguiente">›</button></div>
      <div class="lectura" id="lectura"></div>
    </div>
    <div class="tira" id="tira"></div>
    <p class="ayuda">Flechas del teclado: foto anterior / siguiente. En naranja, las fotos que el modelo no pudo medir.</p>
  </div>
</div>
<script>
const BUCKET = "https://sam-240101.s3.sa-east-1.amazonaws.com";
// Resumen de cada modelo (de los README de modelos/). Imagen: el esquema del entregable, si hay.
const MODELOS = {
  top: { titulo: "Top: apertura de la válvula (0 a 10)", img: "modelos/2-modelo-top/verificacion/explicacion_top.png", pasos: [
    "Alinea la foto contra una foto de referencia (si la cámara se corrió, la corrige; si no puede, usa la alineación de una foto vecina).",
    "Corrige el color de la cámara (balance de blancos), porque de noche o con otra luz el verde cambia.",
    "Busca el mango verde de la palanca por color y forma.",
    "Ubica el mango sobre la curva que recorre la palanca y lo pasa a la escala 0-10 con la calibración: apertura = 0,02909 × posición + 8,9553.",
    "Si el mango no se ve, está tapado o el color no sirve, no inventa: deja el dato vacío con el motivo."] },
  left: { titulo: "Left: distancia de las pesas (mm) y ángulo de la palanca", img: "modelos/1-modelo-left/01-como-funciona.png", pasos: [
    "Alinea la foto contra una referencia (solo correr y girar: la cámara está atornillada).",
    "Encuentra cada varilla buscando el patrón repetido de la rosca (una hendidura cada 10 mm).",
    "Ubica el tapón verde (por color) y la pesa (por color y porque tapa la barra).",
    "Cuenta las hendiduras entre los dos: hendiduras × 10 = mm. No depende de la distancia a la cámara.",
    "Mide además el ángulo de la palanca. Si falta el tapón, la varilla no tiene pesa o algo la tapa, lo informa en vez de medir."] },
  amp: { titulo: "Amp: amperaje de las fases F1, F2 y F3", img: null, pasos: [
    "Rota la foto y la alinea contra una referencia fija (ORB + RANSAC).",
    "Recorta los tres displays (F1, F2, F3) y sus cuatro dígitos.",
    "Lee cada dígito con un clasificador entrenado (HOG + SVM) y lo confirma con la evidencia de los siete segmentos encendidos.",
    "Detecta el punto decimal mirando la foto (no lo adivina por el tamaño del número).",
    "Si no está seguro, prueba lectores de rescate más conservadores; si igual no hay certeza, devuelve NO_VALIDO en vez de un número."] },
};
const MOTIVOS = { sin_pesa: "la varilla no tiene pesa", no_valido_alineacion: "no se pudo alinear la foto (¿poca luz?)",
  color_inutilizable: "el color de la foto no sirve", mango_no_visible: "el mango no se ve", mango_no_encontrado: "no encontró el mango",
  pesa_no_encontrada: "no encontró la pesa", alineacion_fallida: "falló la alineación", fuera_de_rango: "dio un valor fuera de rango (se descarta)",
  angulo_no_medido: "no pudo medir el ángulo", imagen_ilegible: "la imagen no se pudo leer" };
let cam = "top", fotos = [], vista = [], i = 0, variables = {};

function csv(texto) {                       // CSV con comillas (el detalle puede tener comas)
  const filas = []; let f = [], c = "", q = false;
  for (let k = 0; k < texto.length; k++) {
    const ch = texto[k];
    if (q) { if (ch === '"' && texto[k + 1] === '"') { c += '"'; k++; } else if (ch === '"') q = false; else c += ch; }
    else if (ch === '"') q = true; else if (ch === ",") { f.push(c); c = ""; }
    else if (ch === "\n") { f.push(c.replace(/\r$/, "")); filas.push(f); f = []; c = ""; } else c += ch;
  }
  if (c || f.length) { f.push(c); filas.push(f); }
  const [cab, ...resto] = filas;
  return resto.filter(r => r.length === cab.length).map(r => Object.fromEntries(cab.map((h, j) => [h, r[j]])));
}

async function traer(ruta, json) {
  const r = await fetch(ruta + "?t=" + Date.now());
  if (!r.ok) throw new Error(`No se pudo leer ${ruta} (${r.status})`);
  return json ? r.json() : r.text();
}

function urlFoto(archivo) {
  const [, a, m, d] = archivo.match(/(\d{4})-(\d\d)-(\d\d)_/);
  return `${BUCKET}/${a}/${m}/${d}/${archivo}`;
}

function pintarExplicacion() {
  const m = MODELOS[cam];
  document.getElementById("titulo-explica").textContent = "Cómo funciona — " + m.titulo;
  document.getElementById("explica").innerHTML = `<ol>${m.pasos.map(p => `<li>${p}</li>`).join("")}</ol>` +
    (m.img ? `<div><img src="${m.img}" alt="Esquema del modelo ${cam}"></div>` : `<div class="ayuda">Sin esquema todavía para este modelo.</div>`);
}

async function cargarDia() {
  const err = document.getElementById("error");
  try {
    const dia = document.getElementById("dia").value;
    const [texto, panel] = await Promise.all([traer(`datos/lecturas/${cam}/${dia}.csv`), traer(`datos/panel/${dia}.json`, true)]);
    variables = panel.variables;
    const porFoto = new Map();
    for (const f of csv(texto)) {
      if (!porFoto.has(f.archivo)) porFoto.set(f.archivo, { archivo: f.archivo, t: f.t, filas: [] });
      porFoto.get(f.archivo).filas.push(f);
    }
    fotos = [...porFoto.values()].sort((a, b) => a.t.localeCompare(b.t));
    fotos.forEach(f => f.midio = f.filas.some(x => x.valor !== ""));
    err.style.display = "none";
  } catch (e) {
    fotos = [];
    err.textContent = e.message + " (puede que ese día no haya fotos de esta cámara)";
    err.style.display = "block";
  }
  pintarResumen(); filtrar();
}

function pintarResumen() {
  const n = fotos.length, m = fotos.filter(f => f.midio).length, motivos = {};
  fotos.forEach(f => f.filas.forEach(x => { if (x.valor === "") motivos[x.estado] = (motivos[x.estado] || 0) + 1; }));
  const lista = Object.entries(motivos).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${MOTIVOS[k] || k.replaceAll("_", " ")}: ${v}`).join(" · ");
  document.getElementById("resumen").innerHTML = n ? `<div><b>${n}</b>fotos del día</div><div><b>${Math.round(100 * m / n)}%</b>con al menos una medida</div>
    <div style="flex:1;min-width:260px"><span class="ayuda">Por qué no midió (lecturas)</span><br>${lista || "midió todo"}</div>` : "<div>Sin fotos.</div>";
}

function filtrar() {
  const fil = document.getElementById("filtro").value;
  vista = fotos.filter(f => fil === "todas" || (fil === "no" ? !f.midio : f.midio));
  i = 0;
  document.getElementById("tira").innerHTML = vista.map((f, k) =>
    `<button data-k="${k}" class="${f.midio ? "" : "no"}">${f.t.slice(11, 16)}</button>`).join("");
  mostrarFoto();
}

function mostrarFoto() {
  const img = document.getElementById("img"), lec = document.getElementById("lectura");
  document.querySelectorAll("#tira button").forEach(b => b.classList.toggle("actual", +b.dataset.k === i));
  if (!vista.length) { img.removeAttribute("src"); lec.innerHTML = "<p>No hay fotos con ese filtro.</p>"; return; }
  const f = vista[i];
  img.src = urlFoto(f.archivo);
  img.alt = f.archivo;
  document.querySelector(`#tira button[data-k="${i}"]`)?.scrollIntoView({ block: "nearest", inline: "center" });
  lec.innerHTML = `<h2>Foto ${i + 1} de ${vista.length}</h2><div class="cuando">${f.t.slice(0, 16).replace("T", " ")} · ${f.archivo} · ${f.filas[0].version}</div>` +
    f.filas.map(x => {
      const m = variables[`${cam}.${x.variable}`] || {}, u = m.unidad === "0-10" ? "" : (m.unidad || "");
      const valor = x.valor !== "" ? `<div class="v">${(+x.valor).toFixed(1)} ${u}</div>`
                                   : `<div class="v no">No midió: ${MOTIVOS[x.estado] || x.estado.replaceAll("_", " ")}</div>`;
      return `<div class="var"><div class="n">${m.nombre || x.variable}</div>${valor}${x.detalle ? `<div class="d">Nota del modelo: ${x.detalle}</div>` : ""}</div>`;
    }).join("") + `<p class="ayuda"><a href="${urlFoto(f.archivo)}" target="_blank">Abrir la foto original</a></p>`;
}

function mover(d) { if (vista.length) { i = (i + d + vista.length) % vista.length; mostrarFoto(); } }

document.querySelectorAll("[data-cam]").forEach(b => b.addEventListener("click", () => {
  cam = b.dataset.cam;
  document.querySelectorAll("[data-cam]").forEach(x => x.classList.toggle("activo", x === b));
  pintarExplicacion(); cargarDia();
}));
document.getElementById("dia").addEventListener("change", cargarDia);
document.getElementById("filtro").addEventListener("change", filtrar);
document.getElementById("ant").addEventListener("click", () => mover(-1));
document.getElementById("sig").addEventListener("click", () => mover(1));
document.getElementById("tira").addEventListener("click", e => { if (e.target.dataset.k) { i = +e.target.dataset.k; mostrarFoto(); } });
document.addEventListener("keydown", e => { if (e.key === "ArrowLeft") mover(-1); if (e.key === "ArrowRight") mover(1); });

(async () => {
  try {
    const ind = await traer("datos/panel/indice.json", true);
    document.getElementById("dia").innerHTML = ind.dias.slice().reverse().map(d => `<option>${d}</option>`).join("");
  } catch (e) {
    const err = document.getElementById("error");
    err.textContent = e.message; err.style.display = "block";
  }
  pintarExplicacion(); cargarDia();
})();
</script>
</body>
</html>
